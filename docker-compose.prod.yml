# Choros prod overlay (T-0061, E0.6)
#
# Override-file for production deployments. Merge on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  --env-file .env.prod up -d
#
# RULES (RL-3 / AC-3):
#   - Every sensitive variable MUST be in required-form ${VAR} (NO ${VAR:-default}).
#   - docker compose will abort with "variable VAR is not set" if the env file is
#     missing a value — this is intentional and is the prod-secret safety net.
#   - Prod-tomes have _prod suffix (AC-4) — physically isolated from dev volumes.
#   - Keycloak runs in start (prod) mode; KC TLS hardening deferred to E0.7.
#   - No prod secret is committed here (RL-3). See .env.prod.example for template.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # required — no default (RL-3)
      POSTGRES_USER:     ${POSTGRES_USER}        # required
      POSTGRES_DB:       ${POSTGRES_DB}          # required
    volumes:
      - "choros_pgdata_prod:/var/lib/postgresql/data"
      - "./config/postgres:/docker-entrypoint-initdb.d:ro"

  keycloak:
    # prod mode: KC start (prod). KC_HOSTNAME_STRICT=false + KC_HTTP_ENABLED=true
    # are the minimum for a single-server without TLS termination (E0.7 gap).
    # Full KC hardening (KC_PROXY=edge, KC_HOSTNAME_URL) is deferred to E0.7.
    command: start --import-realm
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN}           # required
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}  # required
      KC_DB_PASSWORD:          ${POSTGRES_PASSWORD}        # required (same cred as postgres)
      KC_DB_USERNAME:          ${POSTGRES_USER}            # required
      KC_HOSTNAME_STRICT:      "false"                     # prod single-server: relaxed (E0.7 gap)
      KC_HTTP_ENABLED:         "true"                      # HTTP until TLS/proxy in E0.7

  flowable:
    environment:
      SPRING_DATASOURCE_PASSWORD:       ${POSTGRES_PASSWORD}                   # required
      SPRING_DATASOURCE_USERNAME:       ${POSTGRES_USER}                       # required
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_REST_APP_ADMIN_PASSWORD}    # required

  choros:
    environment:
      DATABASE_URL:     ${DATABASE_URL}       # required
      CHOROS_AUTH_MODE: ${CHOROS_AUTH_MODE}   # required (expected: keycloak)
      NODE_ENV:         production
      PORT:             ${PORT}               # required

volumes:
  choros_pgdata_prod: {}   # physically isolated from choros_pgdata (dev)
