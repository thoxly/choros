# Choros silo substrate — Postgres 16 (T-0053, E0.3).
#
# One postgres:16 instance per контур (stack ADR). All connection params come
# from env with DEV-ONLY defaults — NO prod secret is committed (RL-1/NF-5);
# prod credentials are founder-held and injected at deploy (E0.7).
#
# The bootstrap superuser IS choros_migrator (owner + DDL + the runner's role);
# migration 001 then provisions the non-owner runtime role choros_app.
#
# Bring-up is unattended (NF-4): pg_isready healthcheck lets CI and the runner
# wait for an accepting-connections state with no manual SQL.
#
# Default host port is 55432 (not 5432) so a local ambient Postgres on 5432 does
# not collide; override with POSTGRES_PORT. The runner/app connect via
# DATABASE_URL (e.g. postgres://choros_migrator:choros_dev_pw@localhost:55432/choros).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-choros}
      POSTGRES_USER: ${POSTGRES_USER:-choros_migrator}     # bootstrap = migrator/owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-choros_dev_pw}  # DEV default only (RL-1)
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-choros_migrator} -d ${POSTGRES_DB:-choros}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - "choros_pgdata:/var/lib/postgresql/data"
      - "./config/postgres:/docker-entrypoint-initdb.d:ro"

  # ---------------------------------------------------------------------------
  # Keycloak 25.x — identity substrate (T-0054, E0.4)
  #
  # Runs in start-dev mode with realm import-on-start from config/keycloak/.
  # Internal store = shared Postgres instance (dedicated 'keycloak' schema via
  # KC_DB_SCHEMA=keycloak). Never collides with choros_* tables.
  # Admin credentials are DEV-ONLY defaults (RL-1); prod creds are founder-held
  # and injected at deploy (E0.7).
  #
  # Host port 8180 (KEYCLOAK_PORT) — avoids 5432/55432/3000 (AC-13).
  # KC 25 splits HTTP (8180/KEYCLOAK_PORT) from management/health (9000/KEYCLOAK_MGMT_PORT).
  # Readiness probe: GET /health/ready on management port (24 × 5s retries = 120 s — AC-1).
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    # tini as PID 1 reaps the zombie sh/cat children the CMD-SHELL healthcheck
    # (process-substitution below) spawns every 5s — without it PID 1 (the JVM)
    # never reaps them and ~13k zombies fill the cgroup pids in ~22h, exhausting
    # threads → JVM `pthread_create EAGAIN` → keycloak unhealthy → login down.
    # Incident + diagnosis: T-0431 (2026-06-23).
    init: true
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN:-choros_kc_admin}              # DEV default (RL-1)
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-choros_kc_dev_pw}    # DEV default (RL-1)
      KC_HTTP_PORT:            ${KEYCLOAK_PORT:-8180}
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://postgres:5432/${POSTGRES_DB:-choros}
      KC_DB_SCHEMA:            keycloak
      KC_DB_USERNAME:          ${POSTGRES_USER:-choros_migrator}
      KC_DB_PASSWORD:          ${POSTGRES_PASSWORD:-choros_dev_pw}
      KC_HOSTNAME_STRICT:      "false"
      KC_HTTP_ENABLED:         "true"
      KC_HEALTH_ENABLED:       "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8180"
      - "${KEYCLOAK_MGMT_PORT:-9000}:9000"
    volumes:
      - "./config/keycloak:/opt/keycloak/data/import:ro"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # KC 25 image (quay.io/keycloak/keycloak:25.0.6) ships without curl.
      # Use bash /dev/tcp to hit the KC management port /health/ready endpoint.
      # KC management port is always 9000 INSIDE the container (KC_MANAGEMENT_PORT default);
      # KEYCLOAK_MGMT_PORT is the HOST-side mapping only — do NOT use it here.
      # /health/ready returns HTTP 200 + JSON; we check the status line contains "200".
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200' <(timeout 4 cat <&3) && exec 3>&-"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Flowable 7 — process engine substrate (T-0058, E0.5)
  #
  # Apache 2.0 OSS image (flowable/flowable-rest:7.1.0, pinned — no :latest,
  # no enterprise key). Uses the existing shared Postgres instance via JDBC;
  # ACT_* Liquibase-managed tables land in the dedicated 'flowable' schema
  # (created by config/postgres/002-flowable-schema.sql on first Postgres init
  # — the same isolation pattern as Keycloak's 'keycloak' schema).
  #
  # BPMN deployment is REST-only (POST /flowable-rest/service/repository/deployments);
  # no filesystem auto-deploy — keeps the T-0064 REST-client path the sole canonical
  # deploy mechanism and avoids ordering surprises in CI.
  #
  # Host port 8082 (FLOWABLE_PORT) — no collision with Postgres 55432,
  # Keycloak HTTP 8180, Keycloak mgmt 9000, Node app 3000 (AC-6/NF-5).
  # Admin credentials are DEV-ONLY defaults (RL-1); prod creds are
  # founder-held and injected at deploy (E0.7).
  #
  # Healthcheck: GET /flowable-rest/service/management/engine with admin
  # basic-auth → HTTP 200 when engine is fully up. wget ships in the image.
  flowable:
    image: flowable/flowable-rest:7.1.0
    # T-0483 (BLOCKER #1 of the process half): the engine MUST self-heal. The field
    # walkthrough (2026-06-25) saw POST /publish → 502 ENGINE_UNAVAILABLE; if the JVM
    # transiently dies (OOM / DB blip) the engine must come back on its own rather than
    # leaving every publish/start permanently broken. unless-stopped restarts on any
    # non-clean exit and survives a daemon restart, while still honouring an explicit
    # `docker compose stop`. Combined with the healthcheck below + the API's
    # depends_on: service_healthy, the engine self-heals and the API waits for readiness.
    #
    # NOTE: postgres + keycloak intentionally do NOT carry this line — their service
    # blocks are frozen by ci/checks/flowable/static-checks.sh (FF-FL-11). Adding the
    # same self-heal there is a follow-up that must move the FF-FL-11 baseline in the
    # same change (out of scope for T-0483; see BLOCKERS).
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # currentSchema=flowable directs PostgreSQL JDBC to use the 'flowable' schema
      # as the default search path — Flowable Liquibase creates all ACT_* tables there.
      # This is the JDBC-level schema isolation (ADR §3.1 "URL schema param" option).
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-choros}?currentSchema=flowable
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-choros_migrator}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-choros_dev_pw}   # DEV default (RL-1)
      FLOWABLE_REST_APP_ADMIN_USER_ID:   admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD:  ${FLOWABLE_REST_APP_ADMIN_PASSWORD:-choros_flowable_dev_pw}  # DEV default (RL-1)
      FLOWABLE_ENABLE_HISTORY_CLEANING:  "true"
      FLOWABLE_HISTORY_CLEANING_CYCLE:   "0 0 0 1 1 ?"   # yearly — never fires mid-test
      FLOWABLE_HISTORY_CLEANING_AFTER:   "1"
    ports:
      - "${FLOWABLE_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Flowable 7.1.0 ships BusyBox 1.36.1 wget which does NOT support --password=.
      # Use URL-embedded basic-auth (user:pass@host) — supported by all wget variants.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://admin:${FLOWABLE_REST_APP_ADMIN_PASSWORD:-choros_flowable_dev_pw}@localhost:8080/flowable-rest/service/management/engine || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # ---------------------------------------------------------------------------
  # choros-app — Node.js silo runtime (T-0061, E0.6)
  #
  # Built from the multi-stage Dockerfile in the repo root (web-builder →
  # app-builder → runtime). All env params have DEV-ONLY defaults; prod values
  # are injected by founder via .env.prod at deploy (E0.7, RL-1/RL-3).
  #
  # Internal KC issuer uses compose service name 'keycloak' (not localhost).
  # DATABASE_URL internal host = 'postgres' (compose service name).
  # EXPOSE 3000; host port default APP_PORT=3000 (no collision: 55432/8180/9000/8082).
  # depends_on: all three substrates must be healthy before choros-app starts.
  choros:
    build: .
    # T-0483: self-heal on crash so the silo runtime comes back on its own.
    restart: unless-stopped
    environment:
      DATABASE_URL:     ${DATABASE_URL:-postgres://choros_migrator:choros_dev_pw@postgres:5432/choros}
      CHOROS_AUTH_MODE: ${CHOROS_AUTH_MODE:-dev}
      KEYCLOAK_PORT:    ${KEYCLOAK_PORT:-8180}
      KEYCLOAK_REALM:   ${KEYCLOAK_REALM:-choros}
      KC_ISSUER:        ${KC_ISSUER:-http://keycloak:8180/realms/choros}
      # T-0060: KEYCLOAK_URL — base URL used by JWT guard (server-side, internal compose hostname)
      KEYCLOAK_URL:     ${KEYCLOAK_URL:-http://keycloak:${KEYCLOAK_PORT:-8180}}
      # T-0258: browser-side OIDC config served via GET /api/auth-config (public, non-secret).
      #   KEYCLOAK_PUBLIC_URL — browser-reachable Keycloak origin (NOT the compose-internal
      #     'keycloak' hostname). Defaults to localhost:PORT for local dev; set to the real
      #     external auth origin in prod.
      #   KEYCLOAK_WEB_CLIENT_ID — public PKCE SPA client (config/keycloak/realm-choros.json).
      KEYCLOAK_PUBLIC_URL:    ${KEYCLOAK_PUBLIC_URL:-http://localhost:${KEYCLOAK_PORT:-8180}}
      KEYCLOAK_WEB_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID:-choros-web}
      # T-0342: registrar service-account creds for POST /api/register (human user creation).
      # KEYCLOAK_BASE_URL must be compose-internal so the app container can reach KC.
      KEYCLOAK_BASE_URL:          ${KEYCLOAK_BASE_URL:-http://keycloak:8180}
      KC_REGISTRAR_CLIENT_ID:     ${KC_REGISTRAR_CLIENT_ID:-choros-registrar}
      KC_REGISTRAR_CLIENT_SECRET: ${KC_REGISTRAR_CLIENT_SECRET:-choros-registrar-dev-secret}
      NODE_ENV:         ${NODE_ENV:-development}
      PORT:             ${PORT:-3000}
      # T-0347 [E15-S5 deploy-acceptance]: wire the app→Flowable engine binding so the
      # process-start route (server.ts, gated on FLOWABLE_REST_APP_ADMIN_PASSWORD) and the
      # lifecycle bridge poll-loop (main.ts/startLifecycleBridge, gated on FLOWABLE_BASE_URL)
      # are LIVE on the deployed stack. Base URL MUST use the compose-internal flowable
      # container port 8080 (NOT the host-published 8082) — the in-code default of :8082 is
      # only correct from the host. Admin creds = the dev default already on the flowable
      # service (DEV-only, RL-1; not an external/paid secret).
      FLOWABLE_BASE_URL:                ${FLOWABLE_BASE_URL:-http://flowable:8080/flowable-rest/service}
      FLOWABLE_REST_BASE_URL:           ${FLOWABLE_REST_BASE_URL:-http://flowable:8080/flowable-rest/service}
      FLOWABLE_REST_APP_ADMIN_USER_ID:  ${FLOWABLE_REST_APP_ADMIN_USER_ID:-admin}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_REST_APP_ADMIN_PASSWORD:-choros_flowable_dev_pw}
      # T-0460 [D8-R5]: bridge poll-set MUST include 'agent-step' so the lifecycle bridge
      # fetchAndLocks authored agentTask external tasks and enqueues them as agent-step
      # jobs the (already-wired) D4 dispatcher fires on. 'tel-intake' stays for the DMN
      # triage seam. AGENT_TOPICS (dispatcher) defaults to 'agent-step' in code
      # (DEFAULT_AGENT_TOPIC == AGENT_STEP_TOPIC); set here explicitly for parity / no
      # string drift (FF-R5-6). Dormant-safe: no LLM key → the dispatcher honestly defers.
      FLOWABLE_TOPICS: ${FLOWABLE_TOPICS:-tel-intake,agent-step}
      AGENT_TOPICS:    ${AGENT_TOPICS:-agent-step}
      # T-0363 (E17): DeepSeek LLM wiring. Key has NO default — absent → dormant LLM (honest-degrade).
      DEEPSEEK_API_KEY:  ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL:    ${DEEPSEEK_MODEL:-deepseek-chat}
    ports:
      - "${APP_PORT:-3000}:3000"
    # Pin public resolvers: Docker's embedded DNS forwarder was returning EAI_AGAIN
    # for external names (e.g. api.deepseek.com) → E17 live-LLM calls 500'd and npm
    # build npm-ci hit intermittent SIGPIPE. Direct resolvers make egress reliable.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # WORKAROUND (host embedded-DNS bug): on this dev host Docker's embedded resolver
    # (127.0.0.11) returns EAI_AGAIN when forwarding external names, even with `dns:`
    # set — while the container CAN resolve via 1.1.1.1 directly. Pin the LLM host via
    # /etc/hosts so E17 live chat works. Override DEEPSEEK_HOST_IP if DeepSeek's IP
    # rotates; the durable fix is at the host (Docker daemon / Tailscale DNS) — see
    # founder_request:choros-host-docker-dns. Empty default = no pin (relies on DNS).
    extra_hosts:
      - "api.deepseek.com:${DEEPSEEK_HOST_IP:-3.173.21.63}"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      flowable:
        condition: service_healthy
    healthcheck:
      # node:22-slim has no wget; use the built-in Node.js fetch API (Node 18+).
      # fetch() is available globally in Node 22. Exit 0 on HTTP 200, 1 otherwise.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + (process.env.PORT||'3000') + '/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  choros_pgdata: {}
