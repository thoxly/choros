# T-0117 SPIKE — NOT PRODUCTION. Operaton 1.0.0 OSS (Apache 2.0, Camunda 7 fork) + disposable Postgres 16.
# Independent stack (project -p spike_operaton, named volume, host port 8081).
# Pinned images only (no :latest) — FF-IMAGES-PINNED.
services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_DB: operaton
      POSTGRES_USER: operaton
      POSTGRES_PASSWORD: operaton
    volumes:
      - spike_operaton_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operaton -d operaton"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "55433:5432"

  rest:
    image: operaton/operaton:1.0.0
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://pg:5432/operaton
      DB_USERNAME: operaton
      DB_PASSWORD: operaton
      WAIT_FOR: pg:5432
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/engine-rest/engine || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  spike_operaton_pg:
