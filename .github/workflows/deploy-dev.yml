name: deploy-dev

# R-1: Triggered by successful completion of the "ci" workflow on dev branch.
# Using workflow_run ensures deploy never starts until CI has finished and
# succeeded — the gate is declarative in the workflow definition itself.
#
# Requires two repo secrets (T-0364):
#   - DEPLOY_SSH_KEY    — private key for ubuntu@homeserver-vm (~/.ssh/homeserver_vm)
#   - TAILSCALE_AUTHKEY — Tailscale auth key (ephemeral, reusable) so this cloud
#                         runner can join the tailnet and reach 100.121.76.86.
#                         The server is Tailscale-only; without this the SSH step
#                         cannot connect. (Generate in Tailscale admin → Keys.)
#
# The deploy is non-prod (dev only) and does NOT touch main or prod.
# See docs/environments.md §3 for context.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [dev]

# Minimal permissions — workflow only needs checkout (read).
permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy to dev (homeserver-vm)
    runs-on: ubuntu-latest

    # Gate: only run when the upstream CI workflow succeeded.
    # NOTE: `secrets` context is NOT allowed in job-level `if:` (that caused the
    # previous "workflow file issue"). The secret presence is handled at the
    # step level / fails the SSH step honestly if absent.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Join the tailnet so the cloud runner can reach the Tailscale-only server.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # tag must be permitted to use this auth key in the tailnet ACL.
          tags: tag:ci

      - name: Install SSH key
        # TOFU: ssh-keyscan accepts whatever key the host presents. Accepted for
        # this dev-only workflow — 100.121.76.86 is a Tailscale (WireGuard) address.
        # Secret passed via env: stays in the process environment.
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 100.121.76.86 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy
        env:
          DEPLOY_HOST: "100.121.76.86"
          DEPLOY_USER: "ubuntu"
          DEPLOY_DIR: "/srv/choros"
          SSH_KEY_PATH: "/home/runner/.ssh/deploy_key"
        run: bash scripts/deploy-dev.sh

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
