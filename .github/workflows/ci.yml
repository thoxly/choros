name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Собрать web ДО гейта: тесты статик-раздачи/SPA-fallback зависят от наличия
      # web/dist. Без этого ветка гоняется в состоянии «dist нет», а dev — «dist
      # есть» → зелёный на ветке ≠ зелёный на dev (FE-2026-W24-0004). Гейт обязан
      # гонять в интеграционно-честном окружении.
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm run ci

  # T-0053 · integration-honest Postgres gate (D-056): pins its OWN postgres:16
  # service container — no dependency on ambient build state. Runs the migration
  # runner against an empty DB, RE-RUNS it (idempotency), then the live probe
  # suite incl. the ≥2-tenant anti-decorative-tenant_id check (tenancy §9 guard 5).
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: choros
          POSTGRES_USER: choros_migrator
          POSTGRES_PASSWORD: choros_dev_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U choros_migrator -d choros"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Runner + probes connect as choros_migrator (owner/DDL). The app-role
      # probes derive choros_app from this URL (dev default password).
      DATABASE_URL: postgres://choros_migrator:choros_dev_pw@localhost:5432/choros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 1. Apply all migrations against the empty DB (FF-2).
      - run: node migrations/run.mjs
      # 2. Re-run to prove idempotency (FF-2 / AC-3): zero new applications.
      - run: node migrations/run.mjs
      # 3. Live probe suite: schema + behavior + idempotency + ≥2-tenant guard
      #    (FF-RLS/DENY/LEAD/SCOPE/ROLE/APPEND/FK-RESOLVE/JSONB/ACT/2TENANT).
      - run: npm run fitness:db

  # T-0058 · E0.5 Flowable engine substrate (FF-FL-1..12):
  # Starts postgres + flowable via compose (fresh volume → 002-flowable-schema.sql
  # runs automatically on first init). Waits for Flowable readiness, runs static
  # checks, deploys smoke BPMN via REST, starts a process instance, queries runtime,
  # and verifies ACT_* schema isolation from choros_* tables.
  # Does NOT use docker compose down -v (compose down leaves the named volume intact;
  # volume is ephemeral per CI runner job anyway).
  flowable:
    runs-on: ubuntu-latest
    env:
      # bridge-e2e-smoke.sh (FF-T0067-14..16) needs DATABASE_URL to resolve
      # the genesis tenant UUID from Postgres. Compose default port (55432).
      DATABASE_URL: postgres://choros_migrator:choros_dev_pw@localhost:55432/choros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # bridge-e2e-smoke.sh calls `npm run build` internally (bridge-smoke-runner.js
      # lives in dist/). Installing deps here keeps the flowable job self-contained.
      - run: npm ci
      - name: Start Postgres + Flowable via compose
        run: docker compose up -d postgres flowable
      - name: Wait for Flowable readiness (FF-FL-1)
        run: bash ci/checks/flowable/wait-ready.sh
      - name: Static fitness checks (FF-FL-4..11)
        run: bash ci/checks/flowable/static-checks.sh
      - name: Deploy + smoke BPMN + schema isolation (FF-FL-2/3/12)
        run: bash ci/checks/flowable/smoke.sh
      - name: External-task round-trip smoke (FF-T0064-6)
        run: bash ci/checks/flowable/external-task-smoke.sh
        env:
          FLOWABLE_REST_APP_ADMIN_PASSWORD: choros_flowable_dev_pw
      # T-0067 · FF-T0067-14..16 (D-056 integration-honest gate):
      # Full bridge cycle: poll Flowable external tasks → enqueue in JobStore →
      # outbox deliver → completeTask in Flowable → instance completed.
      # Idempotency (AC-17) and FF-G3 contract (AC-18) verified inside script.
      - name: Bridge E2E smoke (FF-T0067-14..16)
        run: bash ci/checks/flowable/bridge-e2e-smoke.sh
        env:
          FLOWABLE_REST_APP_ADMIN_PASSWORD: choros_flowable_dev_pw
      - name: FF-G3 bridge contract (must remain dormant/green)
        run: bash ci/checks/flowable-bridge-contract.sh
      - name: Stop Flowable (leave Postgres intact)
        if: always()
        run: docker compose stop flowable
